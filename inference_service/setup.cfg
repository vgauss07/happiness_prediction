[flake8]
exclude = 
    app/config/__init__.py
    app/config/.env
    app/logs
    app/model
extend-ignore = 
    WPS226, WPS111, WPS432, WPS515
    WPS412, F401, WPS300
per-file-ignores = 
    src/config/__init__.py: F401
    src/db/db_model.py: WPS420, WPS604, WPS115

max-line-complexity = 20
max-local-variables = 10